---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; shared with the tailwind container.
      - app_var:/app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

  tailwind:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    volumes:
      - ./:/app
      - app_var:/app/var
    # Skip the FrankenPHP entrypoint (DB wait, migrations) — not needed for the asset watcher.
    entrypoint: ["docker-php-entrypoint"]
    command: ["php", "bin/console", "tailwind:build", "--watch"]
    tty: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

  postgres-admin:
    image: dpage/pgadmin4
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: test
      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass*
        uid: '5050'
        gid: '5050'
        mode: 0400
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444

  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5452:5432"
###< doctrine/doctrine-bundle ###

volumes:
  app_var:

configs:
  # https://docs.docker.com/guides/pgadmin/
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Local Database",
            "Group": "Servers",
            "Host": "database",
            "Port": 5432,
            "MaintenanceDB": "app",
            "Username": "app",
            "PassFile": "/config/pgpass"
          }
        }
      }

  pgadmin-pgpass:
    content: |
      database:5432:*:app:!ChangeMe!
